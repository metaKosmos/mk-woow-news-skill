# Fontes RSS da WooW! Daily Drops — SEED.
#
# Este arquivo é só o ponto de partida. A lista viva fica em `sources.json` no bucket
# de estado e é editada pela skill (`woow.py sources add|set-url|disable|remove`), sem
# redeploy. Enquanto ninguém tiver mexido pela skill, vale o que está aqui.
#
# `enabled: false` mantém a fonte registrada mas fora da pesquisa.

feeds:
